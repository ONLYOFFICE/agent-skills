name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  PLUGIN_BRANCH: plugin

jobs:
  release:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check the tag matches the plugin version
        id: info
        run: |
          name="$(node -p "require('./.claude-plugin/plugin.json').name")"
          version="$(node -p "require('./.claude-plugin/plugin.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match .claude-plugin/plugin.json version $version"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the plugin
        run: node tools/build-plugin.mjs
      # create-tag.yml on Gitea publishes the plugin branch together with the tag; the mirror
      # carries both. The zip must hold what the branch holds, so the build is compared with it.
      # The tag may land on GitHub before the branch does, so a missing or older branch is
      # waited for before it fails the release.
      - name: Check the plugin branch holds this build
        env:
          DIR: dist
          ATTEMPTS: 10
          DELAY: 30
        run: |
          export GIT_INDEX_FILE="$RUNNER_TEMP/plugin-index"
          (cd "$DIR" && git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree=. add --all --force .)
          tree="$(git write-tree)"
          for attempt in $(seq "$ATTEMPTS"); do
            if git ls-remote --exit-code --heads origin "$PLUGIN_BRANCH" > /dev/null; then
              git fetch -q --no-tags --depth=1 origin "$PLUGIN_BRANCH"
              if [ "$(git rev-parse "FETCH_HEAD^{tree}")" = "$tree" ]; then
                echo "$PLUGIN_BRANCH ($(git rev-parse --short FETCH_HEAD)) holds the build of $GITHUB_REF_NAME"
                exit 0
              fi
              state="differs"
              echo "$PLUGIN_BRANCH ($(git rev-parse --short FETCH_HEAD)) does not hold this build yet ($attempt/$ATTEMPTS)"
            else
              state="missing"
              echo "$PLUGIN_BRANCH is not on GitHub yet ($attempt/$ATTEMPTS)"
            fi
            [ "$attempt" -lt "$ATTEMPTS" ] && sleep "$DELAY"
          done
          if [ "$state" = "missing" ]; then
            echo "::error::$PLUGIN_BRANCH is not on GitHub: the mirror has not carried it from Gitea, or it is missing there too. Check create-tag.yml on Gitea and the mirror, then re-run this job."
          else
            echo "::error::$PLUGIN_BRANCH ($(git rev-parse --short FETCH_HEAD): $(git log -1 --format=%s FETCH_HEAD)) does not hold the build of $GITHUB_REF_NAME. If create-tag.yml on Gitea published it, the mirror has not synced yet; re-run this job once it has."
          fi
          exit 1
      - name: Pack the zip for OpenAI's directory
        run: cd dist && zip -r -X -q "$GITHUB_WORKSPACE/${{ steps.info.outputs.name }}-${{ steps.info.outputs.version }}.zip" .
      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: ${{ steps.info.outputs.name }}-${{ steps.info.outputs.version }}.zip
          generateReleaseNotes: true

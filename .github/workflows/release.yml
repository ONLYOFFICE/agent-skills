name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  PLUGIN_BRANCH: plugin

jobs:
  release:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check the tag matches the plugin version
        id: info
        run: |
          name="$(node -p "require('./.claude-plugin/plugin.json').name")"
          version="$(node -p "require('./.claude-plugin/plugin.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match .claude-plugin/plugin.json version $version"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Run the offline checks
        run: |
          node skills/apps-embed-sdk/scripts/test-validator.mjs
          node skills/apps-plugin-sdk/scripts/test-validator.mjs
          node skills/apps-ui-kit/scripts/test-validator.mjs
          node .claude/skills/onlyoffice-docs/scripts/test-docs.mjs
          node tools/sync-sources.mjs --check
      - name: Build the plugin
        run: node tools/build-plugin.mjs
      - name: Pack the zip for OpenAI's directory
        run: cd dist && zip -r -X -q "$GITHUB_WORKSPACE/${{ steps.info.outputs.name }}-${{ steps.info.outputs.version }}.zip" .
      - name: Publish the plugin branch
        env:
          DIR: dist
          MESSAGE: ${{ steps.info.outputs.name }} ${{ steps.info.outputs.version }}, built from ${{ github.ref_name }} (${{ github.sha }})
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          parent=""
          if git ls-remote --exit-code --heads origin "$PLUGIN_BRANCH" > /dev/null; then
            git fetch --no-tags --depth=1 origin "$PLUGIN_BRANCH"
            parent="$(git rev-parse FETCH_HEAD)"
          fi
          export GIT_INDEX_FILE="$RUNNER_TEMP/plugin-index"
          (cd "$DIR" && git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree=. add --all --force .)
          tree="$(git write-tree)"
          if [ -n "$parent" ] && [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then
            echo "$PLUGIN_BRANCH already holds this build"
            exit 0
          fi
          commit="$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "$MESSAGE")"
          git push origin "$commit:refs/heads/$PLUGIN_BRANCH"
      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: ${{ steps.info.outputs.name }}-${{ steps.info.outputs.version }}.zip
          generateReleaseNotes: true

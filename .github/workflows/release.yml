name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  PLUGIN_BRANCH: plugin

jobs:
  release:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check the tag matches the plugin version
        id: info
        run: |
          name="$(node -p "require('./.claude-plugin/plugin.json').name")"
          version="$(node -p "require('./.claude-plugin/plugin.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match .claude-plugin/plugin.json version $version"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the plugin
        run: node tools/build-plugin.mjs
      # create-tag.yml on Gitea publishes the plugin branch together with the tag; the mirror
      # carries both. The zip must hold what the branch holds, so the build is compared with it.
      - name: Check the plugin branch holds this build
        env:
          DIR: dist
        run: |
          git fetch --no-tags --depth=1 origin "$PLUGIN_BRANCH"
          export GIT_INDEX_FILE="$RUNNER_TEMP/plugin-index"
          (cd "$DIR" && git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree=. add --all --force .)
          if [ "$(git write-tree)" != "$(git rev-parse "FETCH_HEAD^{tree}")" ]; then
            echo "::error::$PLUGIN_BRANCH ($(git rev-parse --short FETCH_HEAD)) does not hold the build of $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Pack the zip for OpenAI's directory
        run: cd dist && zip -r -X -q "$GITHUB_WORKSPACE/${{ steps.info.outputs.name }}-${{ steps.info.outputs.version }}.zip" .
      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: ${{ steps.info.outputs.name }}-${{ steps.info.outputs.version }}.zip
          generateReleaseNotes: true
